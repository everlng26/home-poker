{% extends "base.html" %}
{% block content %}
<section class="login-page" id="login-page" data-tournament-id="{{ tournament_id }}">
  <div class="login-mark" aria-hidden="true"><img src="{{ url_for('static', path='img/icon.svg') }}" alt=""></div>
  <div class="login-intro">
    <h1>Вход в админку</h1>
    <p>Введите PIN, заданный при создании турнира, чтобы управлять таймером и игроками.</p>
  </div>
  <form id="login" class="login-form">
    <label class="login-field">PIN администратора
      <input id="pin" inputmode="numeric" type="password" minlength="4" maxlength="12" autocomplete="one-time-code" required autofocus aria-describedby="login-hint login-error">
    </label>
    <p class="login-hint" id="login-hint">Только цифры, от 4 до 12.</p>
    <p class="login-error" id="login-error" role="alert" aria-live="polite"></p>
    <button class="login-submit" type="submit">Войти</button>
  </form>
</section>
<script type="module" src="{{ url_for('static', path='js/login.js') }}?v=20261028-1"></script>
{% endblock %}
