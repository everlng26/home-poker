{% extends "base.html" %}
{% block content %}
<section class="card login-page" id="login-page" data-tournament-id="{{ tournament_id }}">
  <div class="login-mark" aria-hidden="true">
    <svg viewBox="0 0 24 24"><path d="M12 3 4.5 6.5v5.2c0 4.3 2.9 7.7 7.5 9.3 4.6-1.6 7.5-5 7.5-9.3V6.5L12 3Z"/><path d="m8.8 12 2.1 2.1 4.5-4.5"/></svg>
  </div>
  <div class="login-intro">
    <p class="eyebrow">Административный доступ</p>
    <h1>Вход в админку</h1>
    <p>Введите PIN администратора, чтобы управлять турниром и таймером.</p>
  </div>
  <form id="login" class="login-form">
    <label class="login-field">PIN администратора
      <input id="pin" inputmode="numeric" type="password" minlength="4" maxlength="12" autocomplete="one-time-code" required autofocus aria-describedby="login-hint login-error">
    </label>
    <p class="login-hint" id="login-hint">PIN был задан при создании турнира.</p>
    <p class="login-error" id="login-error" role="alert" aria-live="polite"></p>
    <button class="login-submit" type="submit">Войти в админку</button>
  </form>
</section>
<script type="module" src="{{ url_for('static', path='js/login.js') }}?v=20260810-1"></script>
{% endblock %}
