<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0f2f22">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Покер">
    <title>{% if page_title and page_title != "Домашний покер" %}{{ page_title }} · {% endif %}Домашний покер</title>
    <link rel="icon" href="{{ url_for('static', path='img/icon.svg') }}" type="image/svg+xml">
    <link rel="apple-touch-icon" href="{{ url_for('static', path='img/apple-touch-icon.png') }}">
    <link rel="manifest" href="{{ url_for('static', path='manifest.webmanifest') }}">
    <link rel="preload" href="{{ url_for('static', path='fonts/sofia-sans-cyrillic.woff2') }}" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="{{ url_for('static', path='fonts/sofia-sans-extra-condensed-latin.woff2') }}" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="{{ url_for('static', path='css/app.css') }}?v=20261028-1">
  </head>
  <body class="{% block body_class %}{% endblock %}">
    {% include "_icons.svg" %}
    <nav class="global-nav" aria-label="Навигация"><a href="/" title="На главную"><svg class="icon" aria-hidden="true"><use href="#i-home"/></svg><span class="sr-only">Домой</span></a></nav>
    <main class="page-shell">{% block content %}{% endblock %}</main>
  </body>
</html>
