{% extends "base.html" %}
{% block content %}
<section class="chip-inventory-page">
  <header class="chip-page-header">
    <div>
      <h1>Фишки</h1>
      <p>Наборы, которые лежат у вас дома: номиналы и сколько фишек каждого.</p>
    </div>
    <div class="chip-page-actions">
      <a class="secondary" href="/stack-optimizer">Конструктор стеков</a>
      <a class="chip-primary-link" href="/chips/new"><svg class="icon" aria-hidden="true"><use href="#i-plus"/></svg>Новый набор</a>
    </div>
  </header>
  <p class="error" id="chip-list-error" aria-live="polite"></p>
  <div id="chip-set-list" class="chip-set-list" aria-live="polite">
    <p class="chip-loading">Загружаю наборы…</p>
  </div>
</section>
<script type="module" src="{{ url_for('static', path='js/chips.js') }}?v=20261028-1"></script>
{% endblock %}
